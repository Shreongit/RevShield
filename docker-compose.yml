version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webshield
      POSTGRES_PASSWORD: webshield_dev_password
      POSTGRES_DB: webshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: webshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: webshield-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://webshield:webshield_dev_password@postgres:5432/webshield
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=production-secret-key-change-this
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: webshield-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
